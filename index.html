<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('kynorie-home-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<title>Kynorie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f5f8;
    --bar: #e3e8ee;
    --text: #1b2028;
    --muted: #4d5866;
    --link: #1f4f8f;
    --line: #b7c1cd;
    --panel: #ffffff;
    --btn: #ffffff;
    --btn-hover: #e8edf3;
    --r: 18px;
    --r-sm: 12px;
    --ease: cubic-bezier(.22, 1, .36, 1);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #14181d;
    --bar: #1c222a;
    --text: #e4e9ef;
    --muted: #a2adba;
    --link: #8fb8f0;
    --line: #36404c;
    --panel: #1c222a;
    --btn: #1c222a;
    --btn-hover: #27303a;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  a { color: var(--link); }
  :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

  @keyframes slideDown { from { opacity: 0; transform: translateY(-24px); } }
  @keyframes rise      { from { opacity: 0; transform: translateY(0.6em); } }
  @keyframes pop       { from { opacity: 0; transform: scale(0.3) rotate(-18deg); } }
  @keyframes bob       { 50% { transform: translateY(-0.12em) rotate(3deg); } }
  @keyframes blink     { 50% { opacity: 0; } }

  .topbar {
    position: sticky;
    top: 0.75rem;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem 1.5rem;
    margin: 0.75rem 1rem 0;
    padding: 0.55rem 1.1rem;
    background: var(--bar);
    border: 1px solid var(--line);
    border-radius: var(--r);
    animation: slideDown 0.8s var(--ease) backwards;
  }
  .logo { display: block; line-height: 0; }
  .logo img {
    height: 36px;
    width: auto;
  }

  .nav { display: flex; align-items: center; flex-wrap: wrap; gap: 0.15rem 0.35rem; }
  .nav > * { animation: rise 0.6s var(--ease) backwards; animation-delay: calc(var(--i) * 70ms + 300ms); }
  .nav a, .nav button.more-btn {
    display: inline-block;
    color: var(--link);
    font: inherit;
    text-decoration: none;
    background: none;
    border: 0;
    border-radius: 999px;
    padding: 0.25rem 0.8rem;
    cursor: pointer;
    transition: background-color 0.25s, transform 0.25s var(--ease);
  }
  .nav a:hover, .nav button.more-btn:hover { background: var(--btn-hover); transform: translateY(-2px); }
  .nav a:active, .nav button.more-btn:active { transform: scale(0.95); }

  .more { position: relative; }
  .more-btn::after {
    content: "";
    display: inline-block;
    margin-left: 0.5em;
    padding: 2.5px;
    border: solid currentColor;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) translateY(-2px);
    transition: transform 0.3s var(--ease);
  }
  .more-btn[aria-expanded="true"]::after { transform: rotate(-135deg) translateY(-2px); }

  .menu {
    position: absolute;
    top: 100%;
    right: 0;
    z-index: 10;
    min-width: 9.5rem;
    margin: 0.5rem 0 0;
    padding: 0.35rem;
    list-style: none;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px) scale(0.95);
    transform-origin: top right;
    transition: opacity 0.2s, transform 0.3s var(--ease), visibility 0s 0.3s;
  }
  .menu.open {
    opacity: 1;
    visibility: visible;
    transform: none;
    transition-delay: 0s;
  }
  .menu li {
    position: relative;
    opacity: 0;
    transform: translateX(10px);
    transition: opacity 0.25s, transform 0.35s var(--ease);
  }
  .menu.open li { opacity: 1; transform: none; transition-delay: calc(var(--i) * 60ms + 80ms); }
  .menu a { display: block; padding: 0.4rem 0.9rem; border-radius: 9px; }
  .menu a:hover { transform: none; }

  .menu a[data-tip]::after {
    content: attr(data-tip);
    position: absolute;
    right: 0;
    bottom: calc(100% + 8px);
    padding: 0.35rem 0.75rem;
    white-space: nowrap;
    font-size: 0.8rem;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(6px) scale(0.96);
    transition: opacity 0.2s, transform 0.3s var(--ease), visibility 0s 0.3s;
    pointer-events: none;
  }
  .menu a[data-tip]:hover::after,
  .menu a[data-tip]:focus-visible::after {
    opacity: 1;
    visibility: visible;
    transform: none;
    transition-delay: 0s;
  }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(2.5rem, 15vh, 8rem) 1.25rem 4rem;
    text-align: center;
  }
  h1 {
    margin: 0 0 1.75rem;
    font-size: clamp(1.8rem, 5.2vw, 3rem);
    font-weight: 600;
    line-height: 1.25;
  }
  .word {
    display: inline-block;
    animation: rise 0.8s var(--ease) backwards;
    animation-delay: calc(var(--i) * 110ms + 350ms);
  }
  .flag-wrap {
    display: inline-block;
    animation:
      pop 0.7s var(--ease) backwards calc(var(--i) * 110ms + 350ms),
      bob 3.4s ease-in-out infinite calc(var(--i) * 110ms + 1.2s);
  }
  .flag { height: 1.15em; width: 1.15em; vertical-align: -0.22em; }

  .gallery-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    min-width: 18rem;
    max-width: 100%;
    height: 3.25rem;
    padding: 0 1.6rem;
    font: inherit;
    color: var(--text);
    background: var(--btn);
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
    animation: rise 0.8s var(--ease) 0.9s backwards;
    transition: background-color 0.25s, transform 0.3s var(--ease), border-color 0.25s;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
  }

  .theme-btn {
    position: relative;
    flex: none;
    display: grid;
    place-items: center;
    width: 3.25rem;
    height: 3.25rem;
    padding: 0;
    color: var(--text);
    background: var(--btn);
    border: 1px solid var(--line);
    border-radius: 50%;
    cursor: pointer;
    overflow: hidden;
    animation: rise 0.8s var(--ease) 1.05s backwards;
    transition: background-color 0.25s, transform 0.3s var(--ease), border-color 0.25s;
  }
  .theme-btn:hover { background: var(--btn-hover); border-color: var(--link); transform: translateY(-3px) rotate(12deg); }
  .theme-btn:active { transform: scale(0.9); }
  .theme-btn .ico {
    grid-area: 1 / 1;
    width: 1.45rem;
    height: 1.45rem;
    transition: transform 0.75s var(--ease), opacity 0.35s;
  }
  .ico-moon path { fill: currentColor; }
  .ico-sun circle, .ico-sun path { stroke: currentColor; }
  .ico-moon { opacity: 1; transform: none; }
  .ico-sun { opacity: 0; transform: rotate(-140deg) scale(0.3); }
  :root[data-theme="dark"] .ico-moon { opacity: 0; transform: rotate(140deg) scale(0.3); }
  :root[data-theme="dark"] .ico-sun { opacity: 1; transform: none; }

  ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  ::view-transition-old(root) { z-index: 1; }
  ::view-transition-new(root) { z-index: 2; }
  html.theme-fade, html.theme-fade *, html.theme-fade *::before, html.theme-fade *::after {
    transition: background-color 0.5s, color 0.5s, border-color 0.5s, fill 0.5s, stroke 0.5s !important;
  }

  .gallery-btn:hover { background: var(--btn-hover); border-color: var(--link); transform: translateY(-3px); }
  .gallery-btn:active { transform: scale(0.96); }
  .gallery-btn svg { width: 1.4em; height: 1.4em; flex: none; transition: transform 0.4s var(--ease); }
  .gallery-btn:hover svg { transform: rotate(-14deg) scale(1.15); }
  .gallery-btn[aria-expanded="true"] svg { transform: rotate(360deg); }
  .gallery-btn svg path { fill: none; stroke: currentColor; stroke-miterlimit: 10; stroke-width: 1.91px; }
  #galleryLabel.typing::after {
    content: "";
    display: inline-block;
    width: 2px;
    height: 1.1em;
    margin-left: 2px;
    background: currentColor;
    vertical-align: -0.2em;
    animation: blink 0.7s steps(1) infinite;
  }

  #gallery {
    display: grid;
    grid-template-rows: 0fr;
    width: 100%;
    max-width: 62rem;
    visibility: hidden;
    transition: grid-template-rows 0.7s var(--ease), visibility 0s 0.7s;
  }
  #gallery.open { grid-template-rows: 1fr; visibility: visible; transition-delay: 0s; }
  .gallery-inner { min-height: 0; overflow: hidden; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.9rem;
    margin: 0;
    padding: 2rem 0.5rem 1rem;
    list-style: none;
  }
  .grid li {
    opacity: 0;
    transform: translateY(28px) scale(0.92);
    transition: opacity 0.4s, transform 0.4s var(--ease);
  }
  #gallery.open .grid li {
    opacity: 1;
    transform: none;
    transition-duration: 0.6s, 0.7s;
    transition-delay: calc(var(--i) * 100ms + 200ms);
  }
  .grid img {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 10;
    object-fit: contain;
    background: #1a1c23;
    border: 1px solid var(--line);
    border-radius: var(--r);
    transition: transform 0.4s var(--ease), border-color 0.3s;
  }
  .grid li { position: relative; }
  .grid li:hover { z-index: 2; }
  .grid li:hover img { transform: translateY(-6px) scale(1.03); border-color: var(--link); }

  .grid li[data-name]::before {
    content: attr(data-name);
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(0.95rem, 2.4vw, 1.5rem);
    font-weight: 500;
    color: rgba(255, 255, 255, 0.7);
    background: rgba(10, 12, 16, 0.4);
    border-radius: var(--r);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.4s var(--ease);
  }
  .grid li[data-name]:hover::before,
  .grid li[data-name]:focus-visible::before {
    opacity: 1;
    transform: translateY(-6px) scale(1.03);
  }

  .grid li[data-tip]::after {
    content: attr(data-tip);
    position: absolute;
    left: 50%;
    bottom: calc(100% - 4px);
    padding: 0.35rem 0.8rem;
    white-space: nowrap;
    font-size: 0.8rem;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    opacity: 0;
    visibility: hidden;
    transform: translate(-50%, 6px) scale(0.96);
    transition: opacity 0.2s, transform 0.3s var(--ease), visibility 0s 0.3s;
    pointer-events: none;
  }
  .grid li[data-tip]:hover::after,
  .grid li[data-tip]:focus-visible::after {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, 0);
    transition-delay: 0s;
  }


  .grid li { cursor: zoom-in; }
  .grid li:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: var(--r); }
  .grid li.lifted img { visibility: hidden; }
  .grid li.lifted::before, .grid li.lifted::after { display: none; }

  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 100;
    visibility: hidden;
    pointer-events: none;
    overscroll-behavior: contain;
    touch-action: none;
  }
  .lightbox.show { visibility: visible; }
  .lightbox.open { pointer-events: auto; }

  .lb-bg {
    position: absolute;
    inset: 0;
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    opacity: 0;
    transition: opacity 0.5s var(--ease);
  }
  .lightbox.open .lb-bg { opacity: 1; }

  .lb-stage {
    position: absolute;
    left: 50%;
    top: 50%;
    cursor: zoom-in;
    touch-action: none;
    user-select: none;
    will-change: transform;
  }
  .lb-stage.zoomed { cursor: zoom-out; }
  .lb-stage.dragging { cursor: grabbing; }
  .lb-stage img {
    position: absolute;
    display: block;
    max-width: none;
    border-radius: 12px;
    background: #1a1c23;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
    pointer-events: none;
    -webkit-user-drag: none;
    transition: opacity 0.45s var(--ease);
  }
  .lb-stage:not(.solo) img + img { transition-delay: 0.25s; }
  .lb-stage.solo img + img { opacity: 0; }

  .lb-close {
    position: absolute;
    top: max(1rem, env(safe-area-inset-top));
    right: 1rem;
    display: grid;
    place-items: center;
    width: 2.75rem;
    height: 2.75rem;
    padding: 0;
    color: var(--text);
    background: var(--btn);
    border: 1px solid var(--line);
    border-radius: 50%;
    cursor: pointer;
    opacity: 0;
    transform: scale(0.5) rotate(-90deg);
    transition: opacity 0.3s, transform 0.5s var(--ease), background-color 0.25s;
  }
  .lightbox.open .lb-close { opacity: 1; transform: none; transition-delay: 0.15s, 0.15s, 0s; }
  .lightbox.open .lb-close:hover { background: var(--btn-hover); transform: rotate(90deg); transition-delay: 0s; }
  .lb-close svg { width: 1.1rem; height: 1.1rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

  .lb-hint {
    position: absolute;
    bottom: max(1.5rem, env(safe-area-inset-bottom));
    left: 50%;
    padding: 0.4rem 1rem;
    font-size: 0.8rem;
    color: var(--muted);
    background: var(--btn);
    border: 1px solid var(--line);
    border-radius: 999px;
    opacity: 0;
    transform: translate(-50%, 10px);
    pointer-events: none;
    transition: opacity 0.4s, transform 0.5s var(--ease);
  }
  .lb-hint.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 560px) {
    .topbar { margin: 0.5rem 0.5rem 0; padding: 0.45rem 0.7rem; }
    .nav { font-size: 0.9rem; }
    .nav a, .nav button.more-btn { padding: 0.2rem 0.55rem; }
    .grid { gap: 0.45rem; }
    .grid img, .grid li[data-name]::before { border-radius: 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
  <div class="lb-bg"></div>
  <div class="lb-stage" id="lbStage"></div>
  <button class="lb-close" id="lbClose" type="button" aria-label="Close image"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  <div class="lb-hint" id="lbHint">Scroll, pinch or click to zoom</div>
</div>

<script>
const moreBtn = document.getElementById('moreBtn');
const moreMenu = document.getElementById('moreMenu');

function setMenu(open) {
  moreMenu.classList.toggle('open', open);
  moreBtn.setAttribute('aria-expanded', String(open));
}
moreBtn.addEventListener('click', e => { e.stopPropagation(); setMenu(!moreMenu.classList.contains('open')); });
document.addEventListener('click', e => { if (!moreMenu.contains(e.target)) setMenu(false); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && moreMenu.classList.contains('open')) { setMenu(false); moreBtn.focus(); }
});

const galleryBtn = document.getElementById('galleryBtn');
const galleryLabel = document.getElementById('galleryLabel');
const gallery = document.getElementById('gallery');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, ms));
let runId = 0;

async function retype(text) {
  const id = ++runId;
  if (reduceMotion) { galleryLabel.textContent = text; return; }
  galleryLabel.classList.add('typing');
  while (galleryLabel.textContent.length && id === runId) {
    galleryLabel.textContent = galleryLabel.textContent.slice(0, -1);
    await sleep(22);
  }
  await sleep(140);
  for (const ch of text) {
    if (id !== runId) return;
    galleryLabel.textContent += ch;
    await sleep(32);
  }
  if (id === runId) galleryLabel.classList.remove('typing');
}

galleryBtn.addEventListener('click', () => {
  const show = !gallery.classList.contains('open');
  gallery.classList.toggle('open', show);
  const label = show ? 'Hide gallery of software' : 'View gallery of software';
  galleryBtn.setAttribute('aria-expanded', String(show));
  galleryBtn.setAttribute('aria-label', label);
  retype(label);
});

const root = document.documentElement;
const themeBtn = document.getElementById('themeBtn');
const osDark = matchMedia('(prefers-color-scheme: dark)');
const hasSavedTheme = () => { try { return !!localStorage.getItem('kynorie-home-theme'); } catch { return false; } };

function paintTheme(t) {
  root.dataset.theme = t;
  const next = t === 'dark' ? 'light' : 'dark';
  themeBtn.setAttribute('aria-label', `Switch to ${next} mode`);
  themeBtn.title = `Switch to ${next} mode`;
}
paintTheme(root.dataset.theme === 'dark' ? 'dark' : 'light');
osDark.addEventListener('change', e => { if (!hasSavedTheme()) paintTheme(e.matches ? 'dark' : 'light'); });

themeBtn.addEventListener('click', () => {
  const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('kynorie-home-theme', next); } catch {}
  const apply = () => paintTheme(next);

  if (!document.startViewTransition || reduceMotion) {
    root.classList.add('theme-fade');
    apply();
    setTimeout(() => root.classList.remove('theme-fade'), 600);
    return;
  }
  const r = themeBtn.getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  const radius = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const vt = document.startViewTransition(apply);
  vt.ready.then(() => {
    root.animate(
      { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${radius}px at ${x}px ${y}px)`] },
      { duration: 750, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', pseudoElement: '::view-transition-new(root)' }
    );
  }).catch(() => {});
});

const lb = document.getElementById('lightbox');
const lbStage = document.getElementById('lbStage');
const lbClose = document.getElementById('lbClose');
const lbHint = document.getElementById('lbHint');
const pageParts = [document.querySelector('.topbar'), document.querySelector('main')];
const DUR = reduceMotion ? 0 : 520;
const GAP = 16;

let lbOpen = false, lbBusy = false, lbTile = null, hintTimer = 0, closeTimer = 0;
let items = [];
let fit = { w: 0, h: 0 }, fitK = 1, maxZ = 4;
let st = { x: 0, y: 0, z: 1 };

function applyState(ms) {
  lbStage.style.transition = ms ? `transform ${ms}ms var(--ease)` : 'none';
  lbStage.style.transform = `translate(${st.x}px, ${st.y}px) scale(${st.z})`;
  lbStage.classList.toggle('zoomed', st.z > 1.001);
}

function layoutStage() {
  const n = items.length;
  const aw = innerWidth * 0.9, ah = innerHeight * 0.82;
  const sumW = items.reduce((a, i) => a + i.nw, 0), maxW = Math.max(...items.map(i => i.nw));
  const sumH = items.reduce((a, i) => a + i.nh, 0), maxH = Math.max(...items.map(i => i.nh));
  const kRow = Math.min((aw - GAP * (n - 1)) / sumW, ah / maxH);
  const kCol = Math.min(aw / maxW, (ah - GAP * (n - 1)) / sumH);
  const row = kRow >= kCol;
  const k = row ? kRow : kCol;
  const totW = row ? sumW * k + GAP * (n - 1) : maxW * k;
  const totH = row ? maxH * k : sumH * k + GAP * (n - 1);
  let cur = 0;
  items.forEach(it => {
    it.w = it.nw * k; it.h = it.nh * k;
    if (row) { it.x = cur; it.y = (totH - it.h) / 2; cur += it.w + GAP; }
    else     { it.x = (totW - it.w) / 2; it.y = cur; cur += it.h + GAP; }
    Object.assign(it.el.style, { left: it.x + 'px', top: it.y + 'px', width: it.w + 'px', height: it.h + 'px' });
  });
  fit = { w: totW, h: totH };
  fitK = k;
  maxZ = Math.max(4, 2 / k);
  Object.assign(lbStage.style, {
    width: totW + 'px', height: totH + 'px', marginLeft: -totW / 2 + 'px', marginTop: -totH / 2 + 'px'
  });
}

function tileState(img) {
  const r = img.getBoundingClientRect();
  const ratio = Math.min(r.width / img.naturalWidth, r.height / img.naturalHeight);
  const first = items[0];
  const z = (img.naturalWidth * ratio) / first.w;
  const cx = first.x + first.w / 2 - fit.w / 2, cy = first.y + first.h / 2 - fit.h / 2;
  return {
    x: r.left + r.width / 2 - innerWidth / 2 - z * cx,
    y: r.top + r.height / 2 - innerHeight / 2 - z * cy,
    z
  };
}

function clampPan() {
  const mx = Math.max(0, (fit.w * st.z - innerWidth) / 2 + 60);
  const my = Math.max(0, (fit.h * st.z - innerHeight) / 2 + 60);
  st.x = Math.min(mx, Math.max(-mx, st.x));
  st.y = Math.min(my, Math.max(-my, st.y));
}

function zoomAt(z2, cx, cy, ms) {
  z2 = Math.min(maxZ, Math.max(1, z2));
  const u = cx - innerWidth / 2, v = cy - innerHeight / 2, k = z2 / st.z;
  st.x = u - (u - st.x) * k;
  st.y = v - (v - st.y) * k;
  st.z = z2;
  if (z2 <= 1.001) { st.x = 0; st.y = 0; st.z = 1; } else clampPan();
  applyState(ms);
}

async function openLightbox(li) {
  const img = li.querySelector('img');
  if (lbOpen || lbBusy || !img || !img.naturalWidth) return;
  lbBusy = true;
  clearTimeout(closeTimer);

  const list = [{ src: img.currentSrc || img.src, alt: img.alt, nw: img.naturalWidth, nh: img.naturalHeight }];
  if (li.dataset.extra) {
    const ex = new Image();
    ex.src = li.dataset.extra;
    try { await ex.decode(); } catch {}
    if (ex.naturalWidth) list.push({ src: ex.src, alt: li.dataset.extraAlt || '', nw: ex.naturalWidth, nh: ex.naturalHeight });
  }

  lbStage.replaceChildren();
  lbStage.classList.add('solo');
  items = list.map(o => {
    const el = new Image();
    el.src = o.src; el.alt = o.alt; el.draggable = false;
    lbStage.append(el);
    return { ...o, el };
  });
  layoutStage();
  await Promise.all(items.map(i => i.el.decode().catch(() => {})));

  lbTile = li;
  st = tileState(img);
  applyState(0);
  li.classList.add('lifted');
  lb.classList.add('show', 'open');
  pageParts.forEach(el => { el.inert = true; });
  document.documentElement.style.overflow = 'hidden';
  lbClose.focus({ preventScroll: true });
  lbOpen = true;
  lbBusy = false;

  requestAnimationFrame(() => requestAnimationFrame(() => {
    lbStage.classList.remove('solo');
    st = { x: 0, y: 0, z: 1 };
    applyState(DUR);
  }));

  lbHint.classList.add('show');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => lbHint.classList.remove('show'), 3200);
}

function closeLightbox() {
  if (!lbOpen) return;
  lbOpen = false;
  const tile = lbTile;
  const img = tile.querySelector('img');
  lbStage.classList.add('solo');
  st = tileState(img);
  applyState(DUR);
  lb.classList.remove('open');
  lbHint.classList.remove('show');
  pageParts.forEach(el => { el.inert = false; });
  document.documentElement.style.overflow = '';
  tile.focus({ preventScroll: true });
  closeTimer = setTimeout(() => {
    lb.classList.remove('show');
    tile.classList.remove('lifted');
    lbStage.replaceChildren();
  }, DUR + 40);
}

const grid = document.querySelector('.grid');
grid.addEventListener('click', e => { const li = e.target.closest('li'); if (li) openLightbox(li); });
grid.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('li')) { e.preventDefault(); openLightbox(e.target); }
});

lbClose.addEventListener('click', closeLightbox);
lb.addEventListener('click', e => { if (e.target === lb || e.target.classList.contains('lb-bg')) closeLightbox(); });

lb.addEventListener('wheel', e => {
  if (!lbOpen) return;
  e.preventDefault();
  zoomAt(st.z * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX, e.clientY, 0);
}, { passive: false });

const ptrs = new Map();
let pinch = null, travel = 0;
lbStage.addEventListener('dragstart', e => e.preventDefault());
lbStage.addEventListener('pointerdown', e => {
  lbStage.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  travel = 0;
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: st.z };
  }
});
lbStage.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  travel += Math.hypot(dx, dy);
  if (ptrs.size === 2 && pinch) {
    const [a, b] = [...ptrs.values()];
    zoomAt(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, (a.x + b.x) / 2, (a.y + b.y) / 2, 0);
  } else if (ptrs.size === 1 && st.z > 1 && travel > 4) {
    lbStage.classList.add('dragging');
    st.x += dx; st.y += dy;
    clampPan();
    applyState(0);
  }
});
const endPtr = e => {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (!ptrs.size) lbStage.classList.remove('dragging');
};
lbStage.addEventListener('pointerup', endPtr);
lbStage.addEventListener('pointercancel', endPtr);

lbStage.addEventListener('click', e => {
  e.stopPropagation();
  if (travel > 4) return;
  if (st.z > 1) zoomAt(1, e.clientX, e.clientY, 280);
  else zoomAt(Math.min(maxZ, Math.max(2.5, 1 / fitK)), e.clientX, e.clientY, 320);
});

document.addEventListener('keydown', e => {
  if (!lbOpen) return;
  const cx = innerWidth / 2, cy = innerHeight / 2;
  if (e.key === 'Escape') { e.preventDefault(); closeLightbox(); }
  else if (e.key === 'Tab') { e.preventDefault(); lbClose.focus(); }
  else if (e.key === '+' || e.key === '=') zoomAt(st.z * 1.4, cx, cy, 220);
  else if (e.key === '-') zoomAt(st.z / 1.4, cx, cy, 220);
  else if (e.key === '0') zoomAt(1, cx, cy, 260);
});

addEventListener('resize', () => {
  if (!lbOpen) return;
  layoutStage();
  st = { x: 0, y: 0, z: 1 };
  applyState(0);
});

async function getCountry() {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 2500);
  try {
    const res = await fetch('https://get.geojs.io/v1/ip/country.json', { signal: ctrl.signal });
    const { country } = await res.json();
    return /^[A-Z]{2}$/.test(country) ? country : null;
  } catch {
    return null;
  } finally {
    clearTimeout(timer);
  }
}

function timeGreeting() {
  const h = new Date().getHours();
  if (h >= 5 && h < 12) return 'Good morning! Friend.';
  if (h >= 12 && h < 18) return 'Good afternoon! Friend.';
  if (h >= 18 && h < 22) return 'Good evening! Friend.';
  return 'Good night? Friend.';
}

function showGreeting(text, flagHTML = '') {
  const el = document.getElementById('greeting');
  const words = text.split(' ');
  el.textContent = '';
  words.forEach((w, i) => {
    const span = document.createElement('span');
    span.className = 'word';
    span.style.setProperty('--i', i);
    span.textContent = w;
    el.append(span, i < words.length - 1 ? ' ' : '');
  });
  if (flagHTML) {
    const wrap = document.createElement('span');
    wrap.className = 'flag-wrap';
    wrap.style.setProperty('--i', words.length);
    wrap.innerHTML = flagHTML;
    el.append(' ', wrap);
  }
}

(async function greet() {
  if (Math.random() < 0.01) {
    const code = await getCountry();
    if (code) {
      let name = code;
      try { name = new Intl.DisplayNames(['en'], { type: 'region' }).of(code); } catch {}
      showGreeting(`Enjoying ${NEEDS_THE.has(code) ? 'the ' : ''}${name}?`, flagFor(code));
      return;
    }
  }
  showGreeting(timeGreeting());
})();
</script>
