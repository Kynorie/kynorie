<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blogs - Kynorie</title>
<meta name="description" content="Blog posts by Kynorie.">
<script>
  try {
    var t = localStorage.getItem("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<style>
  :root, :root[data-theme="dark"] {
    --bg:        #1c2026;
    --panel:     #242930;
    --text:      #d3d8de;
    --muted:     #8b95a1;
    --border:    #3a424c;
    --link:      #8db3e2;
    --link-seen: #b39ddb;
    --icon:      #ffffff;
    --code-bg:   #15181d;
  }
  :root[data-theme="light"] {
    --bg:        #e9eef3;
    --panel:     #f7f9fb;
    --text:      #1e2329;
    --muted:     #5d6773;
    --border:    #a9b7c6;
    --link:      #1a4f9c;
    --link-seen: #5b3a8c;
    --icon:      #000000;
    --code-bg:   #dde5ec;
  }

  * { box-sizing: border-box; border-radius: 0; }

  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.6 Verdana, Tahoma, Arial, sans-serif;
  }

  a { color: var(--link); text-decoration: underline; }
  a:visited { color: var(--link-seen); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px 0 20px;
  }
  .topbar a { display: block; line-height: 0; color: var(--icon); }
  .topbar a:visited { color: var(--icon); }
  .topbar svg { width: 26px; height: 26px; fill: currentColor; }
  .topbar svg.yt { stroke: currentColor; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 8px 20px 40px; }

  header.site { border-bottom: 1px solid var(--border); padding: 12px 0 10px; margin-bottom: 18px; }
  header.site h1 { margin: 0; font: bold 24px/1.2 Georgia, "Times New Roman", serif; }
  header.site h1 a, header.site h1 a:visited { color: var(--text); text-decoration: none; }
  header.site p { margin: 4px 0 0; color: var(--muted); }

  nav.bar { margin-bottom: 18px; color: var(--muted); }
  nav.bar button {
    background: none; border: 0; padding: 0; margin: 0;
    font: inherit; color: var(--link); text-decoration: underline; cursor: pointer;
  }

  .post { background: var(--panel); border: 1px solid var(--border); padding: 12px 14px; margin-bottom: 12px; }
  .post h2 { margin: 0 0 2px; font: bold 17px/1.3 Georgia, "Times New Roman", serif; }
  .post h2 a { color: var(--link); }
  .meta { color: var(--muted); font-size: 11px; margin-bottom: 8px; }
  .meta .tag { margin-left: 6px; }
  .excerpt { margin: 0; }

  .single h2 { font: bold 22px/1.3 Georgia, "Times New Roman", serif; margin: 0 0 4px; }
  .single .content p { margin: 0 0 12px; }
  .single .content pre {
    background: var(--code-bg); border: 1px solid var(--border);
    padding: 8px 10px; overflow-x: auto; font: 12px/1.5 "Courier New", Courier, monospace;
  }
  .single .content code { font-family: "Courier New", Courier, monospace; background: var(--code-bg); padding: 0 3px; }
  .single .content img { max-width: 100%; height: auto; }
  .single .content ul, .single .content ol { margin: 0 0 12px; padding-left: 24px; }
  .single .content blockquote { margin: 0 0 12px; padding: 2px 12px; border-left: 3px solid var(--border); color: var(--muted); }

  .empty { color: var(--muted); padding: 12px 0; }

  footer.site { border-top: 1px solid var(--border); margin-top: 24px; padding-top: 10px; color: var(--muted); font-size: 11px; }
  footer.site button {
    background: none; border: 0; padding: 0; font: inherit;
    color: var(--link); text-decoration: underline; cursor: pointer;
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="site">
    <h1><a href="#" id="home-link">Kynorie's Blog</a></h1>
    <p>Notes, updates and whatever else I feel like writing.</p>
  </header>

  <nav class="bar" id="bar"></nav>

  <main id="app"></main>

  <footer class="site">
    Theme: <button type="button" id="theme-toggle"></button>
  </footer>
</div>

<noscript><div class="wrap"><p>This page needs JavaScript to load the posts.</p></div></noscript>

<script>
(function () {
  var app = document.getElementById("app");
  var bar = document.getElementById("bar");
  var root = document.documentElement;
  var toggle = document.getElementById("theme-toggle");
  var POSTS = [];

  function paintToggle() {
    toggle.textContent = root.getAttribute("data-theme") === "dark"
      ? "Switch to light mode" : "Switch to dark mode";
  }
  toggle.addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
    paintToggle();
  });
  paintToggle();

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function bodyHtml(b) {
    if (Array.isArray(b)) {
      return b.map(function (s) {
        s = String(s);
        return /^\s*</.test(s) ? s : "<p>" + s + "</p>";
      }).join("\n");
    }
    return String(b || "");
  }

  function sorted() {
    return POSTS.slice().sort(function (a, b) { return b.id - a.id; });
  }

  function fmtDate(iso) {
    var p = String(iso).split("-");
    var months = ["January","February","March","April","May","June","July",
                  "August","September","October","November","December"];
    if (p.length !== 3 || !months[+p[1] - 1]) return iso;
    return months[+p[1] - 1] + " " + (+p[2]) + ", " + p[0];
  }

  function excerpt(html) {
    var tmp = document.createElement("div");
    tmp.innerHTML = html;
    var t = (tmp.textContent || "").replace(/\s+/g, " ").trim();
    return t.length > 160 ? t.slice(0, 160).replace(/\s+\S*$/, "") + "..." : t;
  }

  function tagLinks(tags) {
    var wrap = el("span");
    (tags || []).forEach(function (tag) {
      var a = el("a", "tag", "#" + tag);
      a.href = "#tag=" + encodeURIComponent(tag);
      wrap.appendChild(a);
    });
    return wrap;
  }

  function setBar(label, href) {
    bar.textContent = "";
    if (!label) return;
    var a = el("a", null, label);
    a.href = href;
    bar.appendChild(a);
  }

  function renderList(filterTag) {
    var posts = sorted();
    if (filterTag) {
      posts = posts.filter(function (p) { return (p.tags || []).indexOf(filterTag) !== -1; });
    }

    app.textContent = "";
    document.title = filterTag ? "#" + filterTag + " - Kynorie's Blog" : "Blogs - Kynorie";

    if (filterTag) {
      setBar("\u00ab All posts", "#");
      app.appendChild(el("p", "meta", 'Showing posts tagged "' + filterTag + '"'));
    } else {
      setBar("");
    }

    if (!posts.length) {
      app.appendChild(el("p", "empty", "No posts here yet."));
      return;
    }

    posts.forEach(function (p) {
      var box = el("article", "post");
      var h = el("h2");
      var a = el("a", null, p.title);
      a.href = "#" + p.id;
      h.appendChild(a);
      box.appendChild(h);

      var meta = el("div", "meta", "Posted " + fmtDate(p.date));
      meta.appendChild(tagLinks(p.tags));
      box.appendChild(meta);

      box.appendChild(el("p", "excerpt", excerpt(p.body)));
      app.appendChild(box);
    });
  }

  function renderPost(id) {
    var post = POSTS.filter(function (p) { return p.id === id; })[0];
    app.textContent = "";

    if (!post) {
      document.title = "Not found - Kynorie's Blog";
      setBar("\u00ab All posts", "#");
      app.appendChild(el("p", "empty", "That post does not exist. It may have been removed or the link is wrong."));
      return;
    }

    document.title = post.title + " - Kynorie's Blog";
    setBar("\u00ab All posts", "#");

    var box = el("article", "single");
    box.appendChild(el("h2", null, post.title));

    var meta = el("div", "meta", "Posted " + fmtDate(post.date));
    meta.appendChild(tagLinks(post.tags));
    box.appendChild(meta);

    var content = el("div", "content");
    content.innerHTML = post.body;
    box.appendChild(content);

    var list = sorted();
    var i = list.indexOf(post);
    var nav = el("div", "meta");
    nav.style.marginTop = "18px";
    if (list[i + 1]) {
      var older = el("a", null, "\u00ab Older: " + list[i + 1].title);
      older.href = "#" + list[i + 1].id;
      nav.appendChild(older);
    }
    if (list[i + 1] && list[i - 1]) nav.appendChild(document.createTextNode("  |  "));
    if (list[i - 1]) {
      var newer = el("a", null, "Newer: " + list[i - 1].title + " \u00bb");
      newer.href = "#" + list[i - 1].id;
      nav.appendChild(newer);
    }
    box.appendChild(nav);

    app.appendChild(box);
  }

  function route() {
    var h = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (h.indexOf("tag=") === 0) renderList(h.slice(4));
    else if (/^\d+$/.test(h)) renderPost(parseInt(h, 10));
    else renderList();
    window.scrollTo(0, 0);
  }

  window.addEventListener("hashchange", route);

  fetch("/blogs/posts.json", { cache: "no-cache" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (data) {
      POSTS = data.map(function (p) {
        p.id = Number(p.id);
        p.body = bodyHtml(p.body);
        return p;
      });
      route();
    })
    .catch(function (err) {
      app.textContent = "";
      app.appendChild(el("p", "empty",
        "Could not load posts.json (" + err.message + "). If it was edited recently, check it for a missing comma or quote."));
    });
})();
</script>
</body>
</html>
